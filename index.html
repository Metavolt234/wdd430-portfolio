<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Welcome to the WDD 430 Full Stack project.">
		<title>WDD 430 | Full Stack</title>
		<style>
			:root {
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #172033;
				background: #f5f7fb;
			}

			* { box-sizing: border-box; }

			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 2rem;
			}

			main {
				width: min(100%, 48rem);
				padding: clamp(2rem, 7vw, 4.5rem);
				border: 1px solid #e1e6ef;
				border-radius: 1.25rem;
				background: #fff;
				box-shadow: 0 1.5rem 4rem #17203312;
			}

			.eyebrow {
				margin: 0 0 1rem;
				color: #5368d8;
				font-size: .8rem;
				font-weight: 700;
				letter-spacing: .12em;
				text-transform: uppercase;
			}

			h1 {
				max-width: 12ch;
				margin: 0;
				font-size: clamp(2.5rem, 8vw, 4.5rem);
				line-height: 1.05;
				letter-spacing: -.05em;
			}

			.intro {
				max-width: 38rem;
				margin: 1.5rem 0 0;
				color: #596579;
				font-size: 1.1rem;
				line-height: 1.7;
			}

			.status {
				display: inline-flex;
				align-items: center;
				gap: .6rem;
				margin-top: 2rem;
				padding: .65rem .9rem;
				border-radius: 999px;
				background: #eef2ff;
				color: #3549b5;
				font-size: .9rem;
				font-weight: 600;
			}

			.status::before {
				width: .55rem;
				height: .55rem;
				border-radius: 50%;
				background: #5368d8;
				content: "";
			}

			footer {
				margin-top: 3rem;
				padding-top: 1.25rem;
				border-top: 1px solid #e9edf3;
				color: #7b8494;
				font-size: .875rem;
			}
		</style>
	</head>
	<body>
		<main>
			<p class="eyebrow">WDD 430 · Full Stack</p>
			<h1>Welcome to the project.</h1>
			<p class="intro">This is the starting point for your full-stack application. Add your pages and features as the project grows.</p>
			<p class="status">Your app is ready to build</p>
			<footer>WDD 430 Full Stack Project</footer>
		</main>
	</body>
</html>
